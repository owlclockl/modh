# This is the metadata file of the mod, read by NeoForge.
# ${...} placeholders are filled in by Gradle from gradle.properties.

modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
Серверный мод для хардкорных серверов.

После смерти игрок не может зайти на сервер 3 реальных дня.
После возвращения он теряет одно сердце, а чтобы вернуть его,
нужно заходить на сервер каждый день 7 дней подряд.

Все значения (срок бана, количество сердец, длительность
восстановления) настраиваются в конфиге сервера.

Мод работает только на сервере: клиенту его устанавливать не нужно.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
