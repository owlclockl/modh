name: Build

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish build log as a check run
        if: steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build.log', 'utf8'); } catch (e) {}
            const all = log.split('\n');
            const picked = [];
            all.forEach((line, i) => {
              if (/error:|startup failed|What went wrong|Could not resolve/i.test(line)) {
                picked.push(...all.slice(i, i + 7));
              }
            });
            const text = [...picked.slice(-200), '--- last 40 lines ---', ...all.slice(-40)].join('\n').slice(-60000);
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'build-log',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'neutral',
              output: { title: 'Gradle build failure log', summary: text || 'empty log' }
            });

      - name: Fail the job if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload mod jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: hardcore-death-penalty
          path: build/libs/*.jar
          if-no-files-found: error

      # Publish the built jar back to the repository, so it can be downloaded
      # without building the mod locally. Pushes made with GITHUB_TOKEN do not
      # trigger new workflow runs, so this cannot loop.
      - name: Commit the built jar
        if: steps.build.outcome == 'success' && github.event_name == 'push'
        run: |
          set -e
          mkdir -p release
          cp build/libs/*.jar release/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release
          if git diff --cached --quiet; then
            echo "The jar has not changed."
          else
            git commit -m "chore: publish built mod jar [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
