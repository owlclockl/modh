name: Build

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish build log as a check run
        if: steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build.log', 'utf8'); } catch (e) {}
            const all = log.split('\n');
            const interesting = all.filter(l => /error:|FAILURE|Caused by:|Could not|What went wrong|Execution failed|Unresolved|Could not resolve|> Task .* FAILED|Exception|e: /i.test(l));
            const text = (interesting.length ? interesting : all).slice(-60).join('\n').slice(-60000);
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'build-log',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'neutral',
              output: { title: 'Gradle build failure log', summary: text || 'empty log' }
            });

      - name: Fail the job if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload mod jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: hardcore-death-penalty
          path: build/libs/*.jar
          if-no-files-found: error
