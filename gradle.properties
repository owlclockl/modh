# Memory / performance for Gradle itself (not Minecraft)
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment properties
# Minecraft version must agree with the NeoForge version.
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)
# NeoForge version we compile against (the version the server is expected to run).
neo_version=26.3.0.90

## Mod properties

mod_id=hardcore_death_penalty
mod_name=Hardcore Death Penalty
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=io.github.owlclockl.hardcoredeathpenalty
mod_authors=owlclockl
